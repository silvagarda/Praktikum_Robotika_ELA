services:
  dev:
    build: .
    container_name: ros2_dev
    network_mode: host
    tty: true
    stdin_open: true
    command: sleep infinity
    volumes:
      - ..:/ws

  talker:
    build: .
    container_name: ros2_talker
    network_mode: host
    command: ros2 run demo_nodes_cpp talker

  listener:
    build: .
    container_name: ros2_listener
    network_mode: host
    command: ros2 run demo_nodes_cpp listener
